[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0"
description = "A safe, observable coding agent for real Git repositories."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Xianzhe Yang"}]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "langgraph>=1.0",
  "mcp>=1.20",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyyaml>=6.0",
  "tree-sitter-language-pack>=0.9",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
repopilot = "repopilot.cli:main"
repopilot-api = "repopilot.api:main"
repopilot-mcp = "repopilot.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
